name: Izgradi APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Preuzmi MapLibre (3D karta)
        run: |
          curl -fsSL https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js  -o app/src/main/assets/maplibre-gl.js
          curl -fsSL https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css -o app/src/main/assets/maplibre-gl.css

      - name: Izgradi
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Kajak3D.apk

      - name: Objavi APK za preuzimanje
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete najnovija -y --cleanup-tag || true
          gh release create najnovija Kajak3D.apk \
            --target "${{ github.sha }}" \
            --title "Kajak 3D – verzija ${{ github.run_number }}" \
            --notes "Preuzmite Kajak3D.apk na mobitel i instalirajte."

      - uses: actions/upload-artifact@v4
        with:
          name: Kajak3D-apk
          path: Kajak3D.apk
